name: SmartService AI - CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Lint & Unit Test
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_KEY: SmartServiceAI_Secret_Key_Testing_2026

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, openssl, json, tokenizer
          tools: composer:v2
          coverage: none

      - name: 3. Verify PHP Version
        run: php -v

      - name: 4. Validate Composer Configuration
        run: composer validate --strict

      - name: 5. Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 6. PHP Syntax Check (Lint)
        run: |
          echo "Memeriksa sintaks PHP pada semua file project..."
          find . -type f -name "*.php" ! -path "./vendor/*" ! -path "./scratch/*" -print0 | xargs -0 -n 1 -P 4 php -l

      - name: 7. Run PHPUnit Test Suite
        run: vendor/bin/phpunit --testdox

      - name: 8. Run Standalone Test Runner Verification
        run: php tests/run_tests.php
